name: Build Lunex APK
# Build the Android client with live REST and Socket.IO integration.
on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths:
      - 'app/**'
      - 'Lunex-MVP/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
concurrency:
  group: lunex-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test backend and background delivery
        working-directory: Lunex-MVP
        run: |
          npm install --no-audit --no-fund
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Lunex-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
