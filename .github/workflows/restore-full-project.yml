name: Verify Lunex source layout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project entry points without mutating the repository
        run: |
          set -eu
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/app/lunex/MainActivity.kt
          test -f Lunex-MVP/server/index.js
          test -f Lunex-MVP/src/main.jsx
          echo "Source layout verified. This workflow never deletes, rewrites, or pushes project files."
