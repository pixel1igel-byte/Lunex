name: Replace repository with Android project
on:
  push:
    paths:
      - ".github/workflows/install-project.yml"
    branches:
      - main
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace repository files with archive contents
        shell: bash
        run: |
          set -euo pipefail
          test -f Lunex-Android-FIXED.zip
          mkdir -p /tmp/lunex-project
          unzip -q Lunex-Android-FIXED.zip -d /tmp/lunex-project
          test -d /tmp/lunex-project/Lunex-Android
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path.cwd()
          source = Path('/tmp/lunex-project/Lunex-Android')
          for item in root.iterdir():
              if item.name == '.git':
                  continue
              if item.is_dir() and not item.is_symlink():
                  shutil.rmtree(item)
              else:
                  item.unlink()
          for item in source.iterdir():
              target = root / item.name
              if item.is_dir() and not item.is_symlink():
                  shutil.copytree(item, target)
              else:
                  shutil.copy2(item, target)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit"
          else
            git commit -m "Replace repository with Lunex Android project files"
            git push origin HEAD:main
          fi
